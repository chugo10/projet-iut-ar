
<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IUT DE CORSE - Réalité augmentée</title>

  <!-- A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>

  <!-- AR.js avec reconnaissance d'image NFT -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      bottom: 15px;
      left: 10px;
      z-index: 10000;
      padding: 10px 14px;
      color: white;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <!-- Message de suivi -->
  <div id="status">Initialisation de la caméra...</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    arjs="
      trackingMethod: best;
      sourceType: webcam;
      debugUIEnabled: false;
    "
  >

    <!-- Image du nouveau panneau -->
    <a-assets>
      <img
        id="nouveau-panneau"
        src="assets/panneau.svg"
        crossorigin="anonymous"
      >
    </a-assets>

    <!-- Reconnaissance de la photo -->
    <a-nft
      id="marqueur"
      type="nft"
      url="assets/iut"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
      emitevents="true"
    >

      <!-- Image qui remplace l'ancien panneau -->
      <a-entity
        id="remplacement"
        position="50 150 0"
        rotation="-90 0 0"
      >

        <a-plane
          src="#nouveau-panneau"
          width="250"
          height="55"
          material="
            shader: flat;
            transparent: false;
            side: double;
          "
        >
        </a-plane>

      </a-entity>

    </a-nft>

    <!-- Caméra -->
    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const marker = document.querySelector("#marqueur");
    const status = document.querySelector("#status");
    const image = document.querySelector("#nouveau-panneau");

    image.addEventListener("load", () => {
      console.log("Image du panneau chargée");
    });

    image.addEventListener("error", () => {
      status.textContent = "Erreur : image du panneau introuvable";
    });

    marker.addEventListener("markerFound", () => {
      status.textContent = "Photo détectée !";
      console.log("Marqueur NFT reconnu");
    });

    marker.addEventListener("markerLost", () => {
      status.textContent = "Photo non détectée";
      console.log("Marqueur NFT perdu");
    });

    window.addEventListener("camera-error", (event) => {
      status.textContent = "Erreur de caméra";
      console.error(event);
    });
  </script>

</body>
</html>
