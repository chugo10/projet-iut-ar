
<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IUT DE CORSE - AR</title>

  <!-- A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>

  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    .loader {
      position: fixed;
      inset: 0;
      background: black;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      z-index: 999;
    }

    #status {
      position: fixed;
      bottom: 15px;
      left: 10px;
      z-index: 1000;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>

<body>

  <div class="loader" id="loader">
    Chargement de la réalité augmentée...
  </div>

  <div id="status">Recherche de la photo...</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    arjs="trackingMethod: best;
          sourceType: webcam;
          debugUIEnabled: true;">

    <a-assets>
        <img id="nouveau-panneau" src="assets/panneau.png">
    </a-assets>

    <!-- MARQUEUR NFT -->
    <a-nft
      type="nft"
      url="assets/iut"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
      emitevents="true">

      <!-- CONTENU QUI APPARAÎT SUR LA PHOTO -->
      <a-entity
        id="remplacement"
        position="50 150 0"
        rotation="-90 0 0">

        <!-- Masque blanc -->
        <a-plane
          position="0 0 0"
          width="250"
          height="55"
          color="#FFFFFF"
          material="side: double">
        </a-plane>

        <!-- Nouveau texte -->
        <a-text
          value="IUT DE CORSE"
          position="0 0 0.5"
          color="#15558A"
          align="center"
          anchor="center"
          width="250">
        </a-text>

      </a-entity>

    </a-nft>

    <!-- CAMÉRA -->
    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const status = document.getElementById("status");
    const loader = document.getElementById("loader");
    const marker = document.querySelector("a-nft");

    window.addEventListener("arjs-nft-loaded", () => {
        status.textContent = "Marqueur NFT chargé - Présente la photo";
        loader.style.display = "none";
    });

    window.addEventListener("camera-error", (event) => {
        status.textContent = "Erreur caméra";
        console.error(event);
    });

    marker.addEventListener("markerFound", () => {
        status.textContent = "PHOTO DÉTECTÉE !";
    });

    marker.addEventListener("markerLost", () => {
        status.textContent = "Photo perdue";
    });
</script>

</body>
</html>
